[workspace]
members = [
    "ush-obfuscate",
    "base62",
]
resolver = "2"

[workspace.package]
version     = "0.1.0"
edition     = "2024"
authors     = ["ASTATIN3"]
license     = "MIT"
repository  = "https://github.com/Astatin3/unshell"
include     = ["LICENSE", "**/*.rs", "Cargo.toml"]

[workspace.dependencies]
rkyv             = "0.8.16"
serde            = { version = "1.0.228", features = ["derive"] }
serde_json       = "1.0.149"
thiserror        = "2.0.18"
chrono           = "0.4.44"
static_init      = "1.0.4"
unshell      = { path = "." }
# ush-obfuscate = { path = "./ush-obfuscate" }
# base62        = { path = "./base62" }

[package]
name    = "unshell"
version.workspace = true
edition.workspace = true
description = "Pure no_std implementation of the UnShell Protocol"

[features]
default = []
log = []
log_debug = ["log", "dep:chrono"]
# obfuscate_aes = ["ush-obfuscate/obfuscate_aes"]
# obfuscate_ref = ["ush-obfuscate/obfuscate_ref"]

[dependencies]
rkyv              = { workspace = true }
thiserror         = { workspace = true, optional = true }
chrono            = { workspace = true, optional = true }
# ush-obfuscate     = { workspace = true }
static_init       = { workspace = true }

[lints.rust]
elided_lifetimes_in_paths          = "warn"
future_incompatible                = { level = "warn", priority = -1 }
nonstandard_style                  = { level = "warn", priority = -1 }
rust_2018_idioms                   = { level = "warn", priority = -1 }
rust_2021_prelude_collisions       = "warn"
semicolon_in_expressions_from_macros = "warn"
unsafe_op_in_unsafe_fn             = "warn"
unused_import_braces               = "warn"
unused_lifetimes                   = "warn"
trivial_casts                      = "allow"
