[package]
name = "ush-obfuscate"
version.workspace = true
edition.workspace = true
authors.workspace = true
include.workspace = true

[features]
default = ["obfuscate_none"]
obfuscate_none = []
obfuscate_aes = []
obfuscate_ref = []

[lib]
proc-macro = true

[dependencies]
base62 = {path = "../base62"}

# aes = "0.8.4"
block-padding = "0.4.1"
# cbc = "0.1.2"
getrandom = "0.3.4"
hex = "0.4.3"
hex-literal = "1.1.0"
# regex = "1.12.2"
# sha2 = "0.10.9"

# Common
static_init = { workspace = true }

# Specific
quote = "1.0.42"
syn = {version = "2.0.109", features = ["full"]}
proc-macro2 = "1.0.103"
rand = "0.9.2"
